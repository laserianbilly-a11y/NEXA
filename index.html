<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA V15 REAL</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5}.nav{background:#075e54;color:white;padding:10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:99}.nav button{padding:7px 10px;border:none;border-radius:18px;background:#128c7e;color:white;font-weight:bold;font-size:12px}.page{display:none}.page.active{display:block}.card{background:white;margin:8px;border-radius:12px;padding:12px;box-shadow:0 1px 2px #0001}.btn{padding:12px;border:none;border-radius:10px;color:white;font-weight:bold;width:100%;margin-top:8px;cursor:pointer}.green{background:#25D366}.red{background:#ef4444}.blue{background:#075e54}.gold{background:#f59e0b}.avatar{border-radius:50%;object-fit:cover}.story-bar{display:flex;gap:10px;overflow:auto;padding:10px;background:white;margin-bottom:8px;white-space:nowrap}.story{width:60px;text-align:center;cursor:pointer;display:inline-block}.story img{width:56px;height:56px;border-radius:50%;border:3px solid #25D366;object-fit:cover}.wa-bg{background:#efeae2;height:calc(100vh - 50px);display:flex;flex-direction:column}.wa-header{background:#075e54;color:white;padding:12px;display:flex;align-items:center;gap:10px}.wa-messages{flex:1;overflow:auto;padding:10px;background:#e5ddd5}.msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:4px 0}.msg.me{background:#d9fdd3;margin-left:auto}.msg.other{background:white}.wa-input{display:flex;padding:8px;background:#f0f2f5;gap:6px;align-items:center}.wa-input input{flex:1;padding:12px 16px;border-radius:24px;border:none}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}</style></head><body>
<div class="nav"><b>🌍 NEXA</b><button onclick="showPage('feed')">Feed</button><button onclick="showPage('story')">Stories</button><button onclick="showPage('post')">+Post</button><img id="navAvatar" onclick="showPage('profile')" class="avatar" style="width:32px;height:32px;margin-left:auto;display:none;background:white"><button id="authBtn" onclick="handleAuthBtn()" style="margin-left:6px;background:#25D366">Login</button></div>

<div id="auth" class="page"><div class="card" style="max-width:400px;margin:20px auto;text-align:center"><h2 id="authTitle">Create Account</h2><img id="previewPic" class="avatar" style="width:80px;height:80px;background:#ddd;display:none;margin:8px auto"><input id="uPic" type="file" accept="image/*" onchange="previewProfile(this)"><input id="uName" placeholder="Full Name"><input id="uPhone" placeholder="Phone Number"><input id="uPass" type="password" placeholder="Password"><p id="authErr" style="color:red"></p><button class="btn green" id="mainAuthBtn" onclick="handleAuth()">CREATE</button><button class="btn blue" onclick="toggleMode()" id="toggleBtn">Already have? LOGIN</button></div></div>

<div id="feed" class="page active"><div class="story-bar" id="storyBar"><small style="color:#888">Loading stories...</small></div><div id="feedList"><p style="text-align:center;padding:20px">🔄 Loading REAL posts from Firebase...</p></div></div>
<div id="story" class="page"><div class="card"><h3>📸 Add Story (24h)</h3><input id="sFile" type="file" accept="image/*,video/*"><input id="sText" placeholder="Caption"><button class="btn green" onclick="addStory()">POST STORY</button></div></div>
<div id="post" class="page"><div class="card"><h3>📢 Post Goods</h3><input id="pTitle" placeholder="Product"><textarea id="pDesc" placeholder="Price + Desc + City"></textarea><input id="pFile" type="file" accept="image/*,video/*"><button class="btn green" onclick="createPost()">POST TO WORLD 🌍</button><button class="btn gold" onclick="boostPost()">🚀 BOOST - Top 24h - MoMo 677054956</button></div></div>
<div id="profile" class="page"><div class="card" style="max-width:400px;margin:20px auto;text-align:center"><h3>👤 My Profile</h3><img id="myAvatar" class="avatar" style="width:100px;height:100px;background:#ddd;margin:10px auto"><input id="editPic" type="file" accept="image/*" onchange="updateMyPic(this)"><input id="editName"><button class="btn green" onclick="saveProfile()">SAVE PROFILE PICTURE ✅</button></div></div>
<div id="chat" class="page"><div class="wa-bg"><div class="wa-header"><span onclick="showPage('feed')" style="font-size:24px;cursor:pointer">←</span><img id="chatAvatar" class="avatar" style="width:32px;height:32px"><b id="chatName">Shop</b><div style="margin-left:auto;display:flex;gap:16px;font-size:22px"><span onclick="startCall('voice')" style="cursor:pointer">📞</span><span onclick="startCall('video')" style="cursor:pointer">📹</span></div></div><div id="waMsgs" class="wa-messages"></div><div class="wa-input"><button onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()" style="background:#25D366;border:none;width:44px;height:44px;border-radius:50%">🎤</button><input id="waInput" placeholder="Message" onkeypress="if(event.key==='Enter')sendWA()"><button onclick="sendWA()" style="background:#25D366;border:none;width:44px;height:44px;border-radius:50%">➤</button></div><div id="recStatus" style="display:none;text-align:center;color:red;background:#ffe6e6;padding:6px">🔴 Recording...</div></div></div>
<div id="viewStory" class="page"><div id="viewStoryBox" style="background:#000;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;position:relative"></div></div>
<div id="callPage" class="page"><div style="background:#111b21;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;position:relative"><video id="remoteVideo" autoplay playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;background:#000;object-fit:cover"></video><video id="localVideo" autoplay muted playsinline style="width:140px;height:180px;border-radius:12px;position:absolute;top:20px;right:20px;background:#000;border:2px solid #25D366;z-index:5;display:none;object-fit:cover"></video><div style="z-index:2;text-align:center"><img id="callAvatarImg" class="avatar" style="width:100px;height:100px"><h2 id="callName2">Shop</h2><p id="callStatus" style="color:#25D366">Connecting...</p></div><div style="display:flex;gap:18px;margin-top:40px;z-index:2"><button onclick="endCall()" style="background:#ef4444;border:none;width:64px;height:64px;border-radius:50%;font-size:28px">📵</button><button id="muteBtn" onclick="toggleMute()" style="background:#333;border:none;width:64px;height:64px;border-radius:50%">🎤</button><button id="camBtn" onclick="toggleCam()" style="background:#333;border:none;width:64px;height:64px;border-radius:50%">📹</button><button onclick="endCall()" style="background:#25D366;border:none;width:64px;height:64px;border-radius:50%">📞</button></div></div></div>
<div id="superLogin" class="page"><div class="card" style="max-width:400px;margin:40px auto"><h2>👑 Admin</h2><input id="aEmail" placeholder="Email"><input id="aPass" type="password" placeholder="Password"><button class="btn blue" onclick="adminLogin()">LOGIN</button></div></div>
<div id="superDash" class="page"><div class="card"><h2>👑 ADMIN REAL</h2><div style="background:#111b21;color:#25D366;padding:8px;border-radius:8px;font-size:11px">HIDDEN: laserianbilly@gmail.com | MoMo 677054956</div><br><button class="btn blue" onclick="spyAll()">👁️ SPY ALL</button><textarea id="bcast" placeholder="Broadcast message"></textarea><button class="btn green" onclick="doBroadcast()">BROADCAST TO ALL</button><div id="adminPosts"></div><div id="spyBox"></div><div id="allUsersBox"></div></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsb3v0MeZCLemdEOJ_XALqx0KtfTf2hXQ",
  authDomain: "nexa-f2837.firebaseapp.com",
  databaseURL: "https://nexa-f2837-default-rtdb.firebaseio.com",
  projectId: "nexa-f2837",
  storageBucket: "nexa-f2837.firebasestorage.app",
  messagingSenderId: "209803483175",
  appId: "1:209803483175:web:3e56eb1569367d4d7c5602"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let users=[], current=JSON.parse(localStorage.getItem('nexa_current')||'null'), posts=[], msgs=JSON.parse(localStorage.getItem('nexa_wa')||'{}'), stories=[], likes={}, bcasts=[];
let isLogin=false, curChat=null, curChatOwner=null, callStream=null, isMuted=false, camOn=true, mediaRec=null, voiceChunks=[], tempPic='';

function previewProfile(i){if(i.files[0]){let r=new FileReader();r.onload=e=>{tempPic=e.target.result;previewPic.src=tempPic;previewPic.style.display='block';};r.readAsDataURL(i.files[0]);}}
function updateMyPic(i){if(i.files[0]){let r=new FileReader();r.onload=e=>{myAvatar.src=e.target.result;tempPic=e.target.result;};r.readAsDataURL(i.files[0]);}}
function showPage(p){if(p==='feed'){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));feed.classList.add('active');renderFeed();return;}if(p!=='auth'&&p!=='superLogin'&&p!=='superDash'&&p!=='callPage'&&p!=='viewStory'&&!current){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));auth.classList.add('active');return;}document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');if(p==='feed')renderFeed();}
function check(){if(!current){authBtn.innerText='Login';navAvatar.style.display='none';showPage('feed');}else{authBtn.innerText=current.name.split(' ')[0]+' • Logout';navAvatar.style.display='block';navAvatar.src=current.pic||'https://ui-avatars.com/api/?name='+current.name+'&background=25D366&color=fff';showPage('feed');}loadFirebase();}
function toggleMode(){isLogin=!isLogin;authTitle.innerText=isLogin?'Login':'Create';mainAuthBtn.innerText=isLogin?'LOGIN':'CREATE';toggleBtn.innerText=isLogin?'Need account? CREATE':'Already have? LOGIN';uName.style.display=isLogin?'none':'block';uPic.style.display=isLogin?'none':'block';}
function handleAuth(){let n=uName.value.trim(),ph=uPhone.value.trim(),pa=uPass.value.trim();if(isLogin){let f=users.find(u=>u.phone===ph&&u.pass===pa);if(f){current=f;localStorage.setItem('nexa_current',JSON.stringify(f));check();}else authErr.innerText='❌ Wrong phone/pass';}else{if(!n||!ph||!pa)return authErr.innerText='Fill all';if(users.find(u=>u.phone===ph))return authErr.innerText='Phone exists! Login';let nu={id:Date.now(),name:n,phone:ph,pass:pa,pic:tempPic||''};db.ref('users/'+ph).set(nu);current=nu;localStorage.setItem('nexa_current',JSON.stringify(nu));tempPic='';check();}}
function saveProfile(){let nn=editName.value.trim();if(nn)current.name=nn;if(tempPic)current.pic=tempPic;db.ref('users/'+current.phone).update(current);localStorage.setItem('nexa_current',JSON.stringify(current));alert('Profile Saved! ✅');check();}
function handleAuthBtn(){if(current){if(confirm('Logout?')){current=null;localStorage.removeItem('nexa_current');check();}}else showPage('auth');}
function createPost(){if(!current)return;let t=pTitle.value,d=pDesc.value,f=pFile.files[0];if(!t)return alert('Enter title');let save=(m,ty)=>{let id=Date.now();db.ref('posts/'+id).set({id,title:t,desc:d,media:m,type:ty,shop:current.name,owner:current.phone,ownerPic:current.pic||'',time:new Date().toLocaleString(),boosted:false});pTitle.value='';pDesc.value='';showPage('feed');};if(f){let r=new FileReader();r.onload=e=>save(e.target.result,f.type);r.readAsDataURL(f);}else save('','');}
function boostPost(){alert('🚀 To BOOST post:\n1. Send 500F to MoMo 677054956\n2. WhatsApp proof to 677054956\n3. Admin will boost your post to TOP 24h!');}
function addStory(){if(!current)return showPage('auth');let f=sFile.files[0],t=sText.value;if(!f&&!t)return alert('Add image or text');let save=(m,ty)=>{let id=Date.now();db.ref('stories/'+id).set({id,media:m,type:ty||'text',text:t,owner:current.phone,ownerName:current.name,ownerPic:current.pic||'',time:Date.now()});alert('Story posted! 24h');sText.value='';sFile.value='';showPage('feed');};if(f){let r=new FileReader();r.onload=e=>save(e.target.result,f.type);r.readAsDataURL(f);}else save('','text');}
function loadFirebase(){
 db.ref('users').on('value',s=>{users=s.val()?Object.values(s.val()):[];});
 db.ref('posts').on('value',s=>{let v=s.val();posts=v?Object.values(v).sort((a,b)=>{if(a.boosted&&!b.boosted)return -1;if(!a.boosted&&b.boosted)return 1;return b.id-a.id;}):[];renderFeed();renderAdmin();});
 db.ref('stories').on('value',s=>{let v=s.val();let now=Date.now();stories=v?Object.values(v).filter(x=>now-x.time<86400000):[];renderStories();});
 db.ref('likes').on('value',s=>{likes=s.val()||{};renderFeed();});
 db.ref('bcasts').on('value',s=>{bcasts=s.val()?Object.values(s.val()):[];renderFeed();});
}
function renderStories(){let bar=document.getElementById('storyBar');if(!stories.length){bar.innerHTML='<div style="font-size:12px;color:#888">📸 No stories - Be first! Add story</div>';return;}bar.innerHTML=stories.map(st=>`<div class="story" onclick="openStory(${st.id})"><img src="${st.ownerPic||'https://ui-avatars.com/api/?name='+st.ownerName+'&background=25D366&color=fff'}"><br><small>${st.ownerName.split(' ')[0]}</small></div>`).join('');}
function openStory(id){let st=stories.find(x=>x.id===id);if(!st)return;viewStoryBox.innerHTML=`<span onclick="showPage('feed')" style="position:absolute;top:20px;left:20px;font-size:24px;cursor:pointer;z-index:9;background:#0008;padding:4px 10px;border-radius:20px">←</span><div style="text-align:center;margin-top:60px"><img src="${st.ownerPic||''}" class="avatar" style="width:40px;height:40px"><b> ${st.ownerName}</b><br><small>Just now</small></div>${st.media?(st.type.includes('video')?`<video src="${st.media}" controls autoplay style="width:100%;max-height:70vh;margin-top:20px"></video>`:`<img src="${st.media}" style="width:100%;max-height:70vh;object-fit:contain;margin-top:20px">`):''}<p style="margin-top:20px;text-align:center;padding:10px;background:#0008;border-radius:10px">${st.text||''}</p>`;showPage('viewStory');setTimeout(()=>{if(viewStory.classList.contains('active'))showPage('feed');},8000);}
function getUserPic(phone){let u=users.find(x=>x.phone===phone);return u&&u.pic?u.pic:'https://ui-avatars.com/api/?name='+(u?u.name:'U')+'&background=25D366&color=fff';}
function renderFeed(){let l=document.getElementById('feedList');let h='';if(bcasts.length)h+=bcasts.map(b=>`<div class="card" style="background:#fff8c4;border-left:4px solid orange"><b>📢 NOTICE:</b> ${b.text||b}</div>`).join('');h+=posts.map(p=>{let pic=p.ownerPic||getUserPic(p.owner);let likeCount=likes[p.id]?Object.keys(likes[p.id]).length:0;let liked=current&&likes[p.id]&&likes[p.id][current.phone];return `<div class="card" style="${p.boosted?'border:2px solid #f59e0b':''}">${p.boosted?'<span style="background:#f59e0b;color:white;padding:2px 8px;border-radius:8px;font-size:10px">🚀 BOOSTED TOP</span>':''}<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><img src="${pic}" class="avatar" style="width:36px;height:36px"><div><b>${p.shop}</b><br><small style="color:#666">${p.time}</small></div></div><h3 style="margin:8px 0">${p.title}</h3><p>${p.desc}</p>${p.media?(p.type.includes('video')?`<video src="${p.media}" controls style="width:100%;border-radius:12px;max-height:400px"></video>`:`<img src="${p.media}" style="width:100%;border-radius:12px;max-height:400px">`):''}<div style="display:flex;gap:6px;margin-top:10px"><button class="btn ${liked?'red':'blue'}" style="flex:1" onclick="likePost(${p.id})">${liked?'❤️':'🤍'} ${likeCount}</button><button class="btn blue" style="flex:1" onclick="openChat('${p.shop}','${p.owner}')">Chat 🎤📞📹</button><button class="btn green" style="flex:1" onclick="sharePost(${p.id})">Share</button></div></div>`}).join('');l.innerHTML=h||'<div class="card" style="text-align:center;padding:20px"><h3>🌍 Welcome to REAL NEXA World!</h3><p>All posts now sync across all phones! Be first to post!</p></div>';}
function likePost(id){if(!current)return showPage('auth');if(likes[id]&&likes[id][current.phone]){db.ref('likes/'+id+'/'+current.phone).remove();}else{db.ref('likes/'+id+'/'+current.phone).set(true);}}
function sharePost(id){let url=location.href;if(navigator.share){let p=posts.find(x=>x.id===id);navigator.share({title:p.title,text:p.desc,url:url});}else{prompt('Copy link to share on WhatsApp:',url);}}
function openChat(name,owner){if(!current)return showPage('auth');curChat=owner+'_'+current.phone;curChatOwner=owner;chatName.innerText=name;chatAvatar.src=getUserPic(owner);showPage('chat');renderChat();}
function renderChat(){let box=document.getElementById('waMsgs');let m=msgs[curChat]||[];box.innerHTML=m.map(x=>{if(x.voice)return `<div class="msg ${x.me?'me':'other'}"><audio controls src="${x.voice}" style="width:160px"></audio><span style="font-size:10px">${x.time}</span></div>`;return `<div class="msg ${x.me?'me':'other'}">${x.text}<span style="font-size:10px;color:#667781;float:right;margin-left:6px">${x.time} ✓✓</span></div>`}).join('')||'<div style="text-align:center;color:#888;margin-top:40px">Private chat<br>Hold 🎤 for voice<br>📞 voice call<br>📹 video call</div>';box.scrollTop=box.scrollHeight;}
function sendWA(){let t=waInput.value.trim();if(!t)return;if(!msgs[curChat])msgs[curChat]=[];let tm=new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0');msgs[curChat].push({text:t,me:true,time:tm});localStorage.setItem('nexa_wa',JSON.stringify(msgs));waInput.value='';renderChat();}
async function startVoice(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});recStatus.style.display='block';voiceChunks=[];mediaRec=new MediaRecorder(s);mediaRec.ondataavailable=e=>voiceChunks.push(e.data);mediaRec.onstop=()=>{let blob=new Blob(voiceChunks,{type:'audio/webm'});let r=new FileReader();r.onload=e=>{if(!msgs[curChat])msgs[curChat]=[];let tm=new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0');msgs[curChat].push({voice:e.target.result,me:true,time:tm});localStorage.setItem('nexa_wa',JSON.stringify(msgs));renderChat();s.getTracks().forEach(t=>t.stop());};r.readAsDataURL(blob);};mediaRec.start();}catch(e){alert('Allow mic! Click 🔒 -> Allow');}}
function stopVoice(){if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();recStatus.style.display='none';}}
async function startCall(type){if(!current)return showPage('auth');showPage('callPage');callName2.innerText=chatName.innerText;callAvatarImg.src=getUserPic(curChatOwner);callStatus.innerText=type==='video'?'📹 Requesting camera...':'📞 Calling...';try{let c=type==='video'?{audio:true,video:{facingMode:"user"}}:{audio:true,video:false};callStream=await navigator.mediaDevices.getUserMedia(c);localVideo.srcObject=callStream;localVideo.style.display='block';await localVideo.play();if(type==='video'){remoteVideo.style.display='block';remoteVideo.srcObject=callStream;await remoteVideo.play();callStatus.innerText='✅ VIDEO LIVE - Camera ON!';}else callStatus.innerText='✅ VOICE LIVE!';}catch(e){callStatus.innerText='❌ Click 🔒 -> Allow Camera/Mic -> Reload';alert('Allow Camera/Mic!');}}
function endCall(){showPage('chat');if(callStream)callStream.getTracks().forEach(t=>t.stop());localVideo.style.display='none';remoteVideo.style.display='none';}
function toggleMute(){isMuted=!isMuted;if(callStream)callStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);muteBtn.innerText=isMuted?'🔇':'🎤';}
function toggleCam(){camOn=!camOn;if(callStream)callStream.getVideoTracks().forEach(t=>t.enabled=camOn);camBtn.innerText=camOn?'📹':'🚫';}
function adminLogin(){if(aEmail.value==='laserianbilly@gmail.com'&&aPass.value==='ayuk237$'){showPage('superDash');renderAdmin();}else alert('Wrong');}
function renderAdmin(){adminPosts.innerHTML='<h3>Manage Posts</h3>'+posts.map(p=>`<div class="card"><img src="${p.ownerPic||''}" class="avatar" style="width:24px;height:24px"> ${p.title} ${p.boosted?'(BOOSTED)':''}<br><button class="btn gold" onclick="boostToggle(${p.id})">${p.boosted?'Unboost':'Boost to Top'}</button> <button class="btn red" onclick="delPost(${p.id})">Delete</button></div>`).join('');allUsersBox.innerHTML='<h3>All Users REAL</h3>'+users.map(u=>`<div class="card"><img src="${u.pic||''}" class="avatar" style="width:24px;height:24px"> ${u.name} | ${u.phone}</div>`).join('');}
function boostToggle(id){let p=posts.find(x=>x.id===id);db.ref('posts/'+id).update({boosted:!p.boosted});}
function delPost(id){if(confirm('Delete?'))db.ref('posts/'+id).remove();}
function doBroadcast(){let m=bcast.value;if(!m)return;db.ref('bcasts').push({text:m,time:Date.now()});bcast.value='';alert('Broadcast sent!');}
function spyAll(){let h='<h3>👁️ SPY CHATS (Local)</h3>';for(let k in msgs){h+=`<div class="card" style="background:#111b21;color:#25D366"><b>${k}</b><br>${msgs[k].map(x=>x.voice?'🎤 Voice':x.text).join('<br>')}</div>`;}spyBox.innerHTML=h||'No local chats';}
check();let sec=new URLSearchParams(window.location.search).get('boss');if(sec==='677054956')showPage('superLogin');
</script></body></html>
