<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA V7 WORLD</title>
<style>*{margin:0;box-sizing:border-box;font-family:system-ui}body{background:#050508;color:#fff}.header{position:sticky;top:0;background:#050508;border-bottom:1px solid #222;padding:10px;display:flex;justify-content:space-between}.logo{font-weight:900}.nav button{background:#111;border:1px solid #222;color:#888;padding:6px 10px;border-radius:100px;font-size:11px;margin-left:4px}.page{display:none;max-width:600px;margin:0 auto;padding:12px}.page.active{display:block}.card{background:#0f0f10;border:1px solid #222;border-radius:16px;padding:12px;margin-bottom:10px}.post{background:#0f0f10;border:1px solid #222;border-radius:16px;margin:12px 0;overflow:hidden}.post img,.post video{width:100%;display:block}input,textarea,select{width:100%;background:#000;border:1px solid #333;padding:10px;border-radius:10px;color:#fff;margin-top:8px}.btn{padding:10px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.btn-p{background:#7c3aed;color:#fff;width:100%;margin-top:10px}.btn-m{background:#FFCC00;color:#000;width:100%;margin-top:10px}.btn-d{background:#222;color:#fff;width:100%;margin-top:8px}.filter{display:flex;gap:6px;overflow:auto;padding:8px 0}.filter button{background:#111;border:1px solid #222;color:#aaa;padding:5px 10px;border-radius:100px;font-size:11px;white-space:nowrap}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:12px;z-index:9999}.modal.active{display:flex}.box{background:#0f0f10;border:1px solid #222;border-radius:20px;padding:16px;width:100%;max-width:400px}</style></head><body>
<div class="header"><div class="logo">NEXA 🌍 V7</div><div class="nav"> 
<div id="page-feed" class="page active"><div style="text-align:center;padding:10px"><b>🌍 WORLD FEED</b><br><small style="color:#888"></small><br><button class="btn btn-d" onclick="showPage('shopRegister')" style="width:auto;margin-top:8px">➕ Register Shop FREE</button></div><div class="filter" id="filterBar"></div><div id="feed"></div></div>
<div id="page-shopRegister" class="page"><div class="card"><h3>Register Shop FREE</h3><input id="rId" placeholder="Shop ID e.g dubai-luxury"><input id="rName" placeholder="Your Name"><input id="rEmail" placeholder="Email"><input id="rPass" type="password" placeholder="Password"><input id="rCity" placeholder="City e.g Dubai"><select id="rCountry"><option value="CM">Cameroon</option><option value="US">USA</option><option value="AE">Dubai</option><option value="NG">Nigeria</option><option value="GB">UK</option><option value="WORLD">Worldwide</option></select><input id="rPrivate" placeholder="Private MoMo 677XXXX"><input id="rAccName" placeholder="Account Name"><button class="btn-p" onclick="registerShop()">Create Shop</button><div id="rMsg"></div></div></div>
<div id="page-shopLogin" class="page"><div class="card" style="text-align:center"><h3>Shop Login</h3><input id="lEmail" placeholder="Email"><input id="lPass" type="password" placeholder="Password"><button class="btn-p" onclick="shopLogin()">Login</button><div id="lMsg"></div><small>Demo: shop@homereach.com / shop123</small></div></div>
<div id="page-shopDash" class="page"><div class="card"><b id="dName"></b><br><small id="dInfo"></small><br><button class="btn btn-d" onclick="shopLogout()" style="width:auto">Logout</button></div><div class="card"><h4>Post Product</h4><textarea id="pCaption" placeholder="What selling?"></textarea><input id="pPrice" type="number" placeholder="Price"><input type="file" id="pFile"><button class="btn-p" onclick="createPost()">Post to World</button></div><div class="card"><h4>My Sales</h4><div id="dTx"></div></div></div>
<div id="page-superLogin" class="page"><div class="card" style="text-align:center"><h3>Super Admin</h3><input id="sEmail" value="laserianbilly@gmail.com"><input id="sPass" type="password" placeholder="ayuk237$"><button class="btn-p" onclick="superLogin()">Login</button><div id="sMsg"></div></div></div>
<div id="page-superDash" class="page"><div class="card"><b>👑 SUPER - 677054956</b></div><div id="superStats"></div><div class="card"><h4>Transactions</h4><div id="superTx"></div></div></div>
<div id="payModal" class="modal"><div class="box"><h3 id="payTitle">Pay</h3><p id="payInfo"></p><input id="payPhone" placeholder="Your MoMo 677XXXX"><div id="payStatus"></div><button class="btn-m" onclick="payPrivate()">Pay Private</button><button class="btn-d" onclick="closePay()">Cancel</button></div></div>
<div id="chatModal" class="modal"><div class="box"><b id="chatName">Chat</b><div id="chatArea" style="max-height:250px;overflow:auto;background:#000;padding:10px;border-radius:10px;margin:10px 0"></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Message" style="margin-top:0"><button class="btn-p" style="width:auto;margin-top:0" onclick="sendChat()">Send</button></div><button class="btn-d" onclick="closeChat()">Close</button></div></div>
<script>
let currentShop=null,currentChatShop=null,selected='WORLD';
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');if(n==='feed')renderFeed();if(n==='shopDash')renderDash();if(n==='superDash')renderSuper()}
async function renderFeed(){const res=await fetch('/api/posts?country='+(selected==='WORLD'?'':selected));const posts=await res.json();const countries=await (await fetch('/api/countries')).json();document.getElementById('filterBar').innerHTML='<button onclick="selected=\'WORLD\';renderFeed()">🌍 All</button>'+countries.map(c=>`<button onclick="selected='${c.code}';renderFeed()">${c.flag} ${c.name}</button>`).join('');document.getElementById('feed').innerHTML=posts.map(p=>`<div class="post"><div style="padding:10px"><b>${p.shopName} ${p.flag||''}</b><br><small>${p.city} - ${p.currency} ${p.price}</small></div><div style="padding:0 10px 10px">${p.caption}</div>${p.mediaUrl? (p.mediaType==='video'? `<video src="${p.mediaUrl}" controls></video>`:`<img src="${p.mediaUrl}">`):''}<div style="padding:10px;display:flex;gap:6px"><button class="btn btn-d" style="flex:1" onclick="openChat('${p.shopId}')">Chat</button><button class="btn btn-m" style="flex:1" onclick="openPay('${p.shopId}')">Pay</button></div></div>`).join('')||'<div class="card">No posts yet</div>'}
async function registerShop(){const data={shopId:document.getElementById('rId').value,name:document.getElementById('rName').value,email:document.getElementById('rEmail').value,password:document.getElementById('rPass').value,city:document.getElementById('rCity').value,country:document.getElementById('rCountry').value,privatePayment:document.getElementById('rPrivate').value,accountName:document.getElementById('rAccName').value};const r=await fetch('/api/shop/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(j.success){localStorage.setItem('shop_token',j.token);document.getElementById('rMsg').innerHTML='✅ Created!';setTimeout(()=>showPage('shopDash'),800)}else document.getElementById('rMsg').innerHTML=j.error}
async function shopLogin(){const r=await fetch('/api/shop/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('lEmail').value,password:document.getElementById('lPass').value})});const j=await r.json();if(j.success){localStorage.setItem('shop_token',j.token);showPage('shopDash')}else document.getElementById('lMsg').innerHTML=j.error}
function shopLogout(){localStorage.removeItem('shop_token');showPage('shopLogin')}
async function renderDash(){const token=localStorage.getItem('shop_token');const r=await fetch('/api/shop/me',{headers:{'Authorization':'Bearer '+token}});const d=await r.json();document.getElementById('dName').innerText=d.shop.name;document.getElementById('dInfo').innerText=d.shop.city+' - '+d.shop.privatePayment;document.getElementById('dTx').innerHTML=(d.transactions||[]).map(t=>`<div style="background:#111;padding:6px;margin-bottom:4px;border-radius:8px"><b>${t.amount} ${t.currency}</b> - ${t.customerPhone}</div>`).join('')||'No sales';currentShop=d.shop}
async function createPost(){const token=localStorage.getItem('shop_token');const me=await (await fetch('/api/shop/me',{headers:{'Authorization':'Bearer '+token}})).json();const fd=new FormData();fd.append('shopId',me.shop.id);fd.append('caption',document.getElementById('pCaption').value);fd.append('price',document.getElementById('pPrice').value);fd.append('currency',me.shop.currency);const f=document.getElementById('pFile').files[0];if(f)fd.append('media',f);await fetch('/api/posts/create',{method:'POST',body:fd});alert('Posted!');renderDash()}
async function openPay(shopId){const shops=await (await fetch('/api/shops')).json();currentShop=shops.find(s=>s.id===shopId);document.getElementById('payTitle').innerText='Pay '+currentShop.name;document.getElementById('payInfo').innerText='Private: '+currentShop.privatePayment;document.getElementById('payModal').classList.add('active')}function closePay(){document.getElementById('payModal').classList.remove('active')}
async function payPrivate(){const r=await fetch('/api/pay/private',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shopId:currentShop.id,customerPhone:document.getElementById('payPhone').value,amount:currentShop.price||1000})});const j=await r.json();document.getElementById('payStatus').innerHTML='✅ Logged! You get '+j.transaction.shopReceives+' - Commission '+j.transaction.commission+' to 677054956'}
async function openChat(shopId){const shops=await (await fetch('/api/shops')).json();currentChatShop=shops.find(s=>s.id===shopId);document.getElementById('chatName').innerText=currentChatShop.name;document.getElementById('chatModal').classList.add('active');const r=await fetch('/api/chats/'+shopId);const chats=await r.json();document.getElementById('chatArea').innerHTML=chats.map(c=>`<div>${c.message}</div>`).join('')}function closeChat(){document.getElementById('chatModal').classList.remove('active')}
async function sendChat(){await fetch('/api/chats/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shopId:currentChatShop.id,sender:'customer',message:document.getElementById('chatInput').value})});document.getElementById('chatInput').value='';openChat(currentChatShop.id)}
function superLogin(){if(document.getElementById('sEmail').value==='laserianbilly@gmail.com'&&document.getElementById('sPass').value==='ayuk237$'){localStorage.setItem('super_token','SUPER');showPage('superDash')}else document.getElementById('sMsg').innerHTML='Wrong'}
async function renderSuper(){const shops=await (await fetch('/api/shops')).json();const txs=await (await fetch('/api/transactions')).json();document.getElementById('superStats').innerHTML=`Shops: ${shops.length} - Commission: ${shops.reduce((a,s)=>a+(s.commission||0),0)}`;document.getElementById('superTx').innerHTML=txs.map(t=>`<div>${t.shopName} - ${t.amount} - ${t.commission} to 677054956</div>`).join('')}
renderFeed();
</script></body></html>
