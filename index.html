<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA WORLD V8 - FINAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5}.nav{background:#075e54;color:white;padding:10px;display:flex;gap:8px;position:sticky;top:0;z-index:100}.nav button{padding:8px 12px;border:none;border-radius:18px;background:#128c7e;color:white;cursor:pointer;font-weight:bold}.page{display:none}.page.active{display:block}.card{background:white;margin:8px;border-radius:8px;padding:10px;box-shadow:0 1px 2px #0002}.btn{padding:10px;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer;width:100%;margin-top:6px}.green{background:#25D366}.red{background:#e74c3c}.blue{background:#128c7e}.post-img{width:100%;border-radius:8px;max-height:400px;object-fit:cover;margin-top:8px}.wa-bg{background:#efeae2;height:85vh;display:flex;flex-direction:column}.wa-header{background:#075e54;color:white;padding:10px;display:flex;gap:10px;align-items:center}.wa-messages{flex:1;overflow:auto;padding:10px;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}.msg{max-width:75%;padding:8px 10px;border-radius:8px;margin:4px 0}.msg.me{background:#d9fdd3;margin-left:auto}.msg.other{background:white}.wa-input{display:flex;padding:8px;background:#f0f2f5;gap:6px}.wa-input input{flex:1;padding:12px;border-radius:22px;border:none}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0}</style>
</head><body>
<div class="nav"><b>NEXA 🌍</b><button onclick="showPage('feed')">Feed</button><button onclick="showPage('post')">+ Post Goods</button><button onclick="showPage('myShop')">My Shop</button></div>

<div id="feed" class="page active"><div id="feedList"></div></div>

<div id="post" class="page"><div class="card"><h3>📢 Advertise Your Business - Post Goods</h3><input id="pTitle" placeholder="Product name / Business name"><textarea id="pDesc" placeholder="Description & Price - e.g. Shoes 5000F"></textarea><input id="pMedia" type="file" accept="image/*,video/*"><small>Select Picture or Video</small><button class="btn green" onclick="createPost()">POST TO WORLD FEED 🌍</button></div></div>

<div id="myShop" class="page"><div class="card"><h3>🏪 Register Shop FREE</h3><input id="shopName" placeholder="Shop / Business Name"><input id="shopMomo" placeholder="Your MoMo Number"><input id="shopCity" placeholder="City - Bamenda, Douala..."><button class="btn green" onclick="registerShop()">REGISTER - Private MoMo 677054956 gets 10%</button><div id="myShopInfo"></div></div></div>

<div id="chat" class="page"><div class="wa-bg"><div class="wa-header"><span onclick="showPage('feed')" style="font-size:22px;cursor:pointer">←</span><b id="chatName">Chat</b><span style="margin-left:auto">📞 📹 ⋮</span></div><div id="waMessages" class="wa-messages"></div><div class="wa-input"><input id="waInput" placeholder="Type a message" onkeypress="if(event.key==='Enter')sendWA()"><button onclick="sendWA()" style="background:#25D366;border:none;width:44px;height:44px;border-radius:50%;color:white">➤</button></div></div></div>

<div id="superLogin" class="page"><div class="card"><h2>👑 SUPER ADMIN</h2><input id="adminEmail" placeholder="laserianbilly@gmail.com"><input id="adminPass" type="password" placeholder="Password"><button class="btn blue" onclick="adminLogin()">Login</button></div></div>

<div id="superDash" class="page"><div class="card"><h2>👑 SUPER ADMIN DASHBOARD</h2><p>MoMo: 677054956 - All 10% commissions</p>
<button class="btn blue" onclick="loadAllChats()">👁️ SPY ALL CHATS - Load All Messages</button>
<div class="card"><h3>📢 BROADCAST TO ALL USERS</h3><textarea id="broadcastMsg" placeholder="Message to all users..."></textarea><button class="btn green" onclick="broadcast()">SEND BROADCAST TO WORLD 🌍</button></div>
<div id="adminShops"></div><div id="allChatsSpy"></div></div>

<div id="singlePost" class="page"><div id="singlePostView"></div></div>

<script>
let shops=JSON.parse(localStorage.getItem('nexa_shops')||'[]');
let posts=JSON.parse(localStorage.getItem('nexa_posts')||'[]');
let messages=JSON.parse(localStorage.getItem('nexa_wa')||'{}');
let comments=JSON.parse(localStorage.getItem('nexa_comments')||'{}');
let suspended=JSON.parse(localStorage.getItem('nexa_sus')||'[]');
let broadcasts=JSON.parse(localStorage.getItem('nexa_broadcast')||'[]');
let currentChat=null, currentPost=null;

function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');if(p==='feed')renderFeed();if(p==='myShop')renderMyShop();}
function registerShop(){let n=shopName.value,m=shopMomo.value,c=shopCity.value;if(!n||!m)return alert('Fill');shops.push({id:Date.now(),name:n,momo:m,city:c,verified:true});localStorage.setItem('nexa_shops',JSON.stringify(shops));alert('Shop Registered! Private payment enabled!');showPage('feed');}
function createPost(){let t=pTitle.value,d=pDesc.value,f=pMedia.files[0];if(!t)return alert('Add title');let reader=new FileReader();reader.onload=e=>{posts.unshift({id:Date.now(),title:t,desc:d,media:e.target.result,type:f?f.type:'',shop:shops[0]?.name||'Business',time:new Date().toLocaleString(),likes:0});localStorage.setItem('nexa_posts',JSON.stringify(posts));pTitle.value='';pDesc.value='';alert('Posted! Visible to World!');showPage('feed');};if(f)reader.readAsDataURL(f);else{posts.unshift({id:Date.now(),title:t,desc:d,media:'',shop:shops[0]?.name||'Business',time:new Date().toLocaleString(),likes:0});localStorage.setItem('nexa_posts',JSON.stringify(posts));showPage('feed');}}
function renderFeed(){let list=document.getElementById('feedList');let html='';if(broadcasts.length)html+=broadcasts.map(b=>`<div class="card" style="background:#fff3cd;border-left:4px solid #ff9800"><b>📢 ADMIN BROADCAST:</b><br>${b}</div>`).join('');if(posts.length===0)html+='<div class="card">No posts yet. Be first to advertise your business! Click + Post Goods</div>';html+=posts.map(p=>{let isSus=suspended.includes(p.id);if(isSus)return '';let shop=shops.find(s=>s.name===p.shop)||{momo:'677054956'};return `<div class="card"><b>${p.shop}</b> • ${p.time}<h3>${p.title}</h3><p>${p.desc}</p>${p.media?(p.type.includes('video')?`<video src="${p.media}" controls class="post-img"></video>`:`<img src="${p.media}" class="post-img">`):''}<div style="display:flex;gap:6px;margin-top:8px"><button class="btn blue" style="flex:1" onclick="openPost(${p.id})">💬 Comment (${(comments[p.id]||[]).length})</button><button class="btn green" style="flex:1" onclick="openWAByShop('${p.shop}')">💬 WhatsApp Chat</button><button class="btn green" style="flex:1" onclick="alert('Pay to ${shop.momo} Private - Boss 677054956 gets 10%')">💰 Buy - MoMo</button></div></div>`}).join('');list.innerHTML=html;}
function openPost(id){currentPost=id;let p=posts.find(x=>x.id===id);let com=comments[id]||[];document.getElementById('singlePostView').innerHTML=`<div class="card"><span onclick="showPage('feed')" style="cursor:pointer">← Back</span><h3>${p.title}</h3><p>${p.desc}</p>${p.media?(p.type.includes('video')?`<video src="${p.media}" controls class="post-img"></video>`:`<img src="${p.media}" class="post-img">`):''}<hr><h4>Comments</h4><div id="commentList">${com.map(c=>`<div class="card" style="background:#f0f2f5">${c}</div>`).join('')}</div><input id="commentInput" placeholder="Write a comment..."><button class="btn blue" onclick="addComment()">Post Comment</button></div>`;showPage('singlePost');}
function addComment(){let t=commentInput.value;if(!t)return;if(!comments[currentPost])comments[currentPost]=[];comments[currentPost].push(t);localStorage.setItem('nexa_comments',JSON.stringify(comments));commentInput.value='';openPost(currentPost);}
function openWAByShop(name){let s=shops.find(x=>x.name===name)||shops[0];if(!s)return alert('No shop');currentChat=s.id;chatName.innerText=s.name;showPage('chat');renderWA();}
function renderWA(){let box=waMessages;let msgs=messages[currentChat]||[];box.innerHTML=msgs.map(m=>`<div class="msg ${m.me?'me':'other'}">${m.text}<small style="float:right;margin-left:8px;font-size:10px">${m.time} ${m.me?'✓✓':''}</small></div>`).join('');box.scrollTop=box.scrollHeight;}
function sendWA(){let t=waInput.value.trim();if(!t)return;if(!messages[currentChat])messages[currentChat]=[];let time=new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0');messages[currentChat].push({text:t,me:true,time});localStorage.setItem('nexa_wa',JSON.stringify(messages));waInput.value='';renderWA();setTimeout(()=>{messages[currentChat].push({text:'Thanks! Your order noted. Pay MoMo.',me:false,time});localStorage.setItem('nexa_wa',JSON.stringify(messages));renderWA();},800);}
function renderMyShop(){myShopInfo.innerHTML=shops.map(s=>`<div class="card">${s.name} - ${s.momo} - ${s.city}</div>`).join('');}
function adminLogin(){if(adminEmail.value==='laserianbilly@gmail.com'&&adminPass.value==='ayuk237$'){showPage('superDash');renderAdmin();}else alert('Wrong');}
function renderAdmin(){adminShops.innerHTML='<h3>All Accounts - Suspend / Unsuspend</h3>'+posts.map(p=>`<div class="card">${p.title} by ${p.shop} <button class="btn red" onclick="suspend(${p.id})">${suspended.includes(p.id)?'Unsuspend':'Suspend'}</button></div>`).join('')+shops.map(s=>`<div class="card">Shop: ${s.name} - ${s.momo} <button class="btn red" onclick="suspendShop(${s.id})">Suspend Shop</button></div>`).join('');}
function suspend(id){if(suspended.includes(id))suspended=suspended.filter(x=>x!==id);else suspended.push(id);localStorage.setItem('nexa_sus',JSON.stringify(suspended));renderAdmin();renderFeed();}
function suspendShop(id){shops=shops.filter(s=>s.id!==id);localStorage.setItem('nexa_shops',JSON.stringify(shops));renderAdmin();}
function broadcast(){let m=broadcastMsg.value;if(!m)return;broadcasts.unshift(m);localStorage.setItem('nexa_broadcast',JSON.stringify(broadcasts));alert('Broadcast sent to ALL users!');broadcastMsg.value='';}
function loadAllChats(){let html='<h3>👁️ SPY ALL CHATS - All Messages</h3>';for(let k in messages){let shop=shops.find(s=>s.id==k);html+=`<div class="card"><b>Chat with ${shop?.name||k}</b><br>${messages[k].map(m=>`${m.me?'You:':'User:'} ${m.text} (${m.time})`).join('<br>')}</div>`;}allChatsSpy.innerHTML=html;}
renderFeed();
const secret=new URLSearchParams(window.location.search).get('boss');if(secret==='677054956'){showPage('superLogin');}
</script></body></html>
